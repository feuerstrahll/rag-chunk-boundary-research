[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "techdoc-chunking-pipeline"
version = "0.1.0"
description = "Format-aware ingestion foundation for technical documentation."
requires-python = ">=3.11"
dependencies = [
  "pydantic",
  "httpx",
  "beautifulsoup4",
  "PyMuPDF",
  "unstructured",
  "pyyaml",
  "orjson",
  "tiktoken",
  "transformers",
  "pytest",
  "rich",
  "datasets>=5.0.1",
  "sentence-transformers",
  "psutil",
]

[dependency-groups]
dev = [
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I"]

